name: Build and push indexer to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "justfile"
      - "docker-compose.local.yml"
      - ".pre-commit-config.yaml"
      - ".gitignore"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  APP_NAME: datagovuk-indexer
  AWS_REGION: eu-west-2

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push indexer to ${{ matrix.environment }} ECR
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [integration, staging] # add production with a reviewer gate in settings -> environment -> production later
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets[format('{0}_DEPLOYER_ROLE_ARN', matrix.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: python-run-production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}
          cache-to: type=inline

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.environment }}-${{ env.APP_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/td.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' /tmp/td.json > task-definition.json

      - name: Update task definition with new image
        run: |
          jq --arg image "${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            '.containerDefinitions[0].image = $image' \
            task-definition.json > task-definition-updated.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-definition-updated.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
