name: Build and push indexer to staging ECR

on:
  push:
    branches:
      - main
    paths:
      - "indexer/**"
      - "config/**"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/push-to-staging-ecr.yaml"
  workflow_dispatch:

env:
  APP_NAME: datagovuk-indexer
  AWS_REGION: eu-west-2
  ECS_CLUSTER_STAGING: staging
  INTEGRATION_ECR: 836822603246.dkr.ecr.eu-west-2.amazonaws.com
  STAGING_ECR: 805684806124.dkr.ecr.eu-west-2.amazonaws.com

jobs:
  ci:
    name: Run tests and linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint and test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: python-run-production
          platforms: linux/amd64
          cache-to: type=inline

  push_to_staging:
    name: Push indexer to staging ECR
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to staging Amazon ECR
        id: staging-ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Copy image from integration ECR to staging ECR
        run: |
          crane copy \
            ${{ env.INTEGRATION_ECR }}/${{ env.APP_NAME }}:${{ github.sha }} \
            ${{ steps.staging-ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition staging-${{ env.APP_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/td.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' /tmp/td.json > task-definition.json

      - name: Update task definition with new image
        run: |
          jq --arg image "${{ steps.staging-ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            '.containerDefinitions[0].image = $image' \
            task-definition.json > task-definition-updated.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-definition-updated.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
