services:
  indexer:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: python-run-dev
    container_name: datagovuk_indexer
    volumes:
      - .:/app:z
      - /app/.venv
    env_file:
      - path: ./.envs/.local
        required: true
      - path: ./.envs/.local-overrides
        required: false
    command: tail -f /dev/null
    depends_on:
      - opensearch
      - postgres

  postgres:
    image: postgis/postgis:14-3.5-alpine
    container_name: postgres_db
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_DB: ckan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch_node
    restart: always
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true # Prevent memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set JVM heap size
      - DISABLE_INSTALL_DEMO_CONFIGS=true # Disables default demo security/certs if needed
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch_dashboards
    restart: always
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true" # Must match OpenSearch's security setting
    depends_on:
      - opensearch

volumes:
  postgres_data:
  opensearch_data:
